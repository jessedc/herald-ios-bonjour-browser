included:
  - Herald/Herald

excluded:
  - Herald/HeraldUITests
  - .build

# Rules tuned for the project
disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_string
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last

large_tuple:
  warning: 4

cyclomatic_complexity:
  warning: 20

line_length:
  warning: 150
  error: 200

type_body_length:
  warning: 550
  error: 800

file_length:
  warning: 900
  error: 1200

function_body_length:
  warning: 100
  error: 150

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 60
    error: 80
